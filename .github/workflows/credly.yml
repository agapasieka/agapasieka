name: Update Credly Badges

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
    
      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Update badges
        run: |
          python scripts/update_credly.py
          
      - name: Upload Credly debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credly-debug
          path: |
            ./credly-page.html
            ./credly-page.png
          if-no-files-found: warn
          
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md
          git diff --cached --quiet || git commit -m "Update Credly badges"
          git push
